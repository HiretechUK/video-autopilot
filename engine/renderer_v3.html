<script type="module">
// ===== Imagine You v3: 2D characters in 3D sets (Rick's Clips rule book, Haseeb 1 Nov 2026) =====
// window.setup(timeline) once, then window.renderAt(t) per frame. Everything is deterministic (seeded).
import * as THREE from 'three';
const W = 1080, H = 1920, INK = '#241726';
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const lerp = (a, b, t) => a + (b - a) * t;

function rnd(seed) { let s = seed % 2147483647; if (s <= 0) s += 2147483646; return () => (s = s * 16807 % 2147483647) / 2147483647; }

// ---------------------------------------------------------------- three.js setup
const gl = new THREE.WebGLRenderer({ canvas: document.getElementById('gl'), antialias: true, preserveDrawingBuffer: true });
gl.setPixelRatio(1); gl.setSize(W, H, false);
gl.shadowMap.enabled = true; gl.shadowMap.type = THREE.PCFSoftShadowMap;
gl.toneMapping = THREE.ACESFilmicToneMapping; gl.toneMappingExposure = 1.3;
gl.outputColorSpace = THREE.SRGBColorSpace;
const ui = document.getElementById('ui').getContext('2d');
const rt = new THREE.WebGLRenderTarget(W, H, { samples: 4, type: THREE.HalfFloatType });
rt.depthTexture = new THREE.DepthTexture(W, H); rt.depthTexture.type = THREE.UnsignedIntType;
const postCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1), postScene = new THREE.Scene();
const post = new THREE.ShaderMaterial({
  uniforms: { tColor: { value: rt.texture }, tDepth: { value: rt.depthTexture }, res: { value: new THREE.Vector2(W, H) },
    near: { value: .05 }, far: { value: 200 }, dof: { value: 0 }, focus: { value: 3 }, ink: { value: 1 }, flash: { value: 0 } },
  vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0., 1.); }',
  fragmentShader: `
    uniform sampler2D tColor, tDepth; uniform vec2 res; uniform float near, far, dof, focus, ink, flash; varying vec2 vUv;
    float lin(vec2 uv){ float z = texture2D(tDepth, uv).r * 2. - 1.; return 2. * near * far / (far + near - z * (far - near)); }
    void main(){
      float d = lin(vUv);
      // lens blur: background (and very near foreground) soften on close-ups, focus on the character
      vec3 col = texture2D(tColor, vUv).rgb;
      if (dof > 0.) {
        float coc = clamp(abs(d - focus) / max(d, .1) * 1.6, 0., 1.) * dof;
        if (coc > .4) { vec3 acc = col; float n = 1.;
          for (int i = 0; i < 12; i++) { float a = float(i) * 2.39996; float r = sqrt(float(i) + .5) / 3.5 * coc;
            vec2 o = vec2(cos(a), sin(a)) * r / res; acc += texture2D(tColor, vUv + o).rgb; n += 1.; }
          col = acc / n; }
      }
      // ink: ~3 px near-black lines on silhouettes and depth jumps of the 3D world (measured from the reference)
      if (ink > 0.) {

        float dl = lin(vUv - vec2(px.x, 0.)), dr = lin(vUv + vec2(px.x, 0.)), du = lin(vUv + vec2(0., px.y)), dd = lin(vUv - vec2(0., px.y));
        e = max(max(abs(dl + dr - 2. * d), abs(du + dd - 2. * d)), .5 * max(abs(dl - dr), abs(du - dd))) / d;
        float line = smoothstep(.012, .035, e) * (1. - smoothstep(30., 70., d)) * ink;

      }
      gl_FragColor = vec4(col, 1.);
      #include <tonemapping_fragment>
      #include <colorspace_fragment>

      vec3 g = gl_FragColor.rgb; float l = dot(g, vec3(.2126, .7152, .0722));

      float v = 1. - .16 * smoothstep(.35, 1.05, length((vUv - .5) * vec2(1., 1.25)) * 1.3);
      gl_FragColor.rgb = mix(g * v, vec3(1.), flash);
    }`, depthTest: false, depthWrite: false });
postScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), post));
const camera = new THREE.PerspectiveCamera(42, W / H, 0.05, 200);

const mat = (c, o = {}) => new THREE.MeshStandardMaterial({ color: c, roughness: .85, metalness: 0, flatShading: true, ...o });
const glow = (c, i = 1) => new THREE.MeshStandardMaterial({ color: c, emissive: c, emissiveIntensity: i, roughness: 1 });
function box(w, h, d, m, x = 0, y = 0, z = 0, cast = true) {
  const b = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m); b.position.set(x, y, z); b.castShadow = cast; b.receiveShadow = true; return b;
}
function cyl(rt, rb, h, m, x = 0, y = 0, z = 0, seg = 8) {
  const c = new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, seg), m); c.position.set(x, y, z); c.castShadow = true; c.receiveShadow = true; return c;
}
function cone(r, h, m, x, y, z, seg = 7) { const c = new THREE.Mesh(new THREE.ConeGeometry(r, h, seg), m); c.position.set(x, y, z); c.castShadow = true; return c; }
function gradTex(stops) {
  const c = document.createElement('canvas'); c.width = 4; c.height = 512; const g = c.getContext('2d');
  const gr = g.createLinearGradient(0, 0, 0, 512); stops.forEach(([o, col]) => gr.addColorStop(o, col)); g.fillStyle = gr; g.fillRect(0, 0, 4, 512);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
function sky(stops) {
  const m = new THREE.Mesh(new THREE.SphereGeometry(90, 24, 16), new THREE.MeshBasicMaterial({ map: gradTex(stops), side: THREE.BackSide, fog: false }));
  m.rotation.x = Math.PI; return m;   // gradient top->bottom
}
function checker(a, b, n = 8) {
  const c = document.createElement('canvas'); c.width = c.height = 256; const g = c.getContext('2d');
  for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) { g.fillStyle = (i + j) % 2 ? a : b; g.fillRect(i * 256 / n, j * 256 / n, 256 / n, 256 / n); }
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.colorSpace = THREE.SRGBColorSpace; return t;
}
const TEXC = {};
function paint(kind, hex, rep = [1, 1]) {

  const c = document.createElement('canvas'); c.width = c.height = 256; const g = c.getContext('2d'), r = rnd(hex % 9973 + kind.length * 31);
  const col = new THREE.Color(hex), sh = (k) => `rgb(${col.r * 255 * k | 0},${col.g * 255 * k | 0},${col.b * 255 * k | 0})`;
  g.fillStyle = sh(1); g.fillRect(0, 0, 256, 256);

  g.globalAlpha = 1;
  if (kind === 'brick') { g.fillStyle = sh(.72); for (let y = 0; y < 256; y += 16) { g.fillRect(0, y, 256, 2.5); for (let x = (y / 16) % 2 ? 0 : 16; x < 256; x += 32) g.fillRect(x, y, 2.5, 16); } }

  if (kind === 'paving') { g.fillStyle = sh(.78); for (let y = 0; y < 256; y += 64) g.fillRect(0, y, 256, 3); for (let x = 0; x < 256; x += 64) g.fillRect(x, 0, 3, 256); }
  if (kind === 'asphalt') { for (let i = 0; i < 900; i++) { g.fillStyle = r() < .5 ? sh(.8) : sh(1.2); g.fillRect(r() * 256, r() * 256, 1.5, 1.5); } }
  if (kind === 'wood') { g.fillStyle = sh(.7); for (let y = 0; y < 256; y += 32) g.fillRect(0, y, 256, 2.5); for (let i = 0; i < 60; i++) { g.fillStyle = sh(.85); g.fillRect(r() * 256, r() * 256, 30 + r() * 60, 1); } }
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(...rep); t.anisotropy = 4;
  return (TEXC[key] = t);
}
const pmat = (kind, hex, rep, o = {}) => new THREE.MeshStandardMaterial({ map: paint(kind, hex, rep), roughness: .9, flatShading: false, ...o });
function stars(n, seed, col = 0xdfe6ff) {
  const r = rnd(seed), p = [];
  for (let i = 0; i < n; i++) { const a = r() * Math.PI * 2, e = .15 + r() * 1.2; p.push(80 * Math.cos(a) * Math.cos(e), 80 * Math.sin(e), 80 * Math.sin(a) * Math.cos(e)); }

  return new THREE.Points(g, new THREE.PointsMaterial({ color: col, size: .35, fog: false }));
}
function moon(x, y, z) { const m = new THREE.Mesh(new THREE.CircleGeometry(4, 32), new THREE.MeshBasicMaterial({ color: 0xeef2ff, fog: false })); m.position.set(x, y, z); m.lookAt(0, 2, 0); return m; }

  l.shadow.bias = -0.0004; l.shadow.normalBias = .02; l.shadow.camera.layers.enableAll(); return l;
}
function lamp(x, z, h = 3.6, col = 0xffb35c) {   // street lamp: pole + head + warm light
  const g = new THREE.Group();
  g.add(cyl(.05, .07, h, mat(0x2a2a33), x, h / 2, z, 6));
  g.add(box(.5, .08, .12, mat(0x2a2a33), x + .2, h, z));
  const bulb = new THREE.Mesh(new THREE.SphereGeometry(.12, 10, 8), glow(col, 3)); bulb.position.set(x + .38, h - .08, z); g.add(bulb);
  const l = new THREE.PointLight(col, 30, 10, 1.6); l.position.set(x + .38, h - .2, z); g.add(l);
  return { g, light: l, bulb, base: 30 };
}

// ---------------------------------------------------------------- 3D sets
// each returns {root, update(t, scene, local), focus:{window?:Vector3}}
const SETS = {
  city_night(seed) {
    // A shopfront street at night: the character stands on the pavement with a lit, detailed set right behind
    // them (Rick's Clips never puts a character in front of empty space).
    const root = new THREE.Group(), r = rnd(seed);
    root.add(sky([[0, '#140b2e'], [.45, '#2d2468'], [1, '#5a4a8f']]), stars(260, 7), moon(-20, 40, -60));
    const hemi = new THREE.HemisphereLight(0x6f6ad0, 0x2a1838, .45); root.add(hemi);
    const moonKey = keyLight(0x9fb0ff, .55, [-6, 12, 8]); root.add(moonKey);
    root.add(box(40, .16, 4.6, pmat('paving', 0x9a8f9a, [20, 2.3]), 0, .02, -.3, false));           // pavement
    root.add(box(40, .2, .25, mat(0x6f6670), 0, .06, 2.0, false));             // kerb
    root.add(box(40, .1, 10, pmat('asphalt', 0x3a3a52, [12, 3]), 0, -.05, 7, false));               // road (towards camera)
    for (let i = -18; i < 18; i += 2.2) root.add(box(1, .02, .15, glow(0xd9c36a, .25), i, .01, 6, false));
    for (let i = -18; i < 18; i += 1.2) root.add(box(.02, .17, 4.6, mat(0x857a86), i, .03, -.3, false));   // paving joints
    const windows = [], cols = [0xd8644a, 0xb87a4e, 0x5f8a9a, 0x8a5e91, 0xc98d3a, 0x4f8a7a, 0xc75b7a], awn = [0xe8384f, 0x2f8f6a, 0x3b6fd9, 0xf2b631, 0x8a4fd0];
    let xi = -15;
    while (xi < 15) {
      const w = 2.6 + r() * 1.4, h = 4.8 + r() * 4, c = cols[Math.floor(r() * cols.length)], cx = xi + w / 2, fz = -2.6;
      root.add(box(w, h, 3, pmat(r() < .5 ? 'brick' : 'plaster', c, [w / 2.5, h / 2.5]), cx, h / 2, fz - 1.5));
      root.add(box(w + .1, .22, 3.1, mat(0x2a2230), cx, h + .1, fz - 1.5));
      root.add(box(w + .06, .12, .2, mat(0x3a2a33), cx, 3.2, fz + .05));   // cornice between shop and flats
      // shop window + door + awning + sign
      const shop = new THREE.MeshStandardMaterial({ color: 0x332a20, emissive: 0xffb45a, emissiveIntensity: 1.1, roughness: 1 });
      const sw = new THREE.Mesh(new THREE.PlaneGeometry(w * .55, 1.3), shop); sw.position.set(cx - w * .12, 1.15, fz + .02); root.add(sw);
      root.add(box(.7, 1.9, .06, mat(0x3a2a22), cx + w * .3, .95, fz + .03, false));
      const aw = box(w * .9, .12, .9, mat(awn[Math.floor(r() * awn.length)]), cx, 2.3, fz + .4); aw.rotation.x = .28; root.add(aw);
      root.add(box(w * .6, .42, .08, mat(awn[Math.floor(r() * awn.length)]), cx, 2.85, fz + .05));
      windows.push({ m: shop, on: true, shop: true, ph: r() * 6, id: windows.length, pos: sw.position.clone() });
      for (let fy = 3.6; fy < h - .5; fy += 1.35) for (let fx = xi + .5; fx < xi + w - .4; fx += .95) {
        const m = new THREE.MeshStandardMaterial({ color: 0x1a1f33, emissive: 0xffa53a, emissiveIntensity: 0, roughness: 1 });
        const p = new THREE.Mesh(new THREE.PlaneGeometry(.45, .62), m); p.position.set(fx + .25, fy, fz + .02); root.add(p);
        root.add(box(.58, .07, .12, mat(0xe8dccb), fx + .25, fy - .35, fz + .06, false), box(.58, .05, .05, mat(0x2a2230), fx + .25, fy + .33, fz + .04, false));
        windows.push({ m, on: r() < .55, ph: r() * 6, id: windows.length, pos: p.position.clone() });
      }
      xi += w + .08;
    }
    let sx = -18; while (sx < 18) { const w = 3 + r() * 3, h = 10 + r() * 10; root.add(box(w, h, 3, mat(0x2a2450), sx + w / 2, h / 2, -14)); sx += w + .3; }  // skyline
    const furn = (x) => { const g = new THREE.Group(); const k = Math.floor(r() * 3);
      if (k === 0) { g.add(box(1.4, .08, .45, mat(0x7a4a2a), 0, .5, 0), box(1.4, .45, .06, mat(0x7a4a2a), 0, .75, -.2), box(.06, .5, .4, mat(0x222222), -.6, .25, 0), box(.06, .5, .4, mat(0x222222), .6, .25, 0)); }
      else if (k === 1) { g.add(cyl(.28, .24, .8, mat(0x3f6a4a), 0, .4, 0, 10)); }
      else { g.add(cyl(.13, .15, .6, mat(0xd8382f), 0, .3, 0, 8), cyl(.17, .17, .1, mat(0xd8382f), 0, .62, 0, 8)); }
      g.position.set(x, .1, -1.6 + r() * .4); return g; };
    for (let i = -12; i < 12; i += 3.3 + r() * 2) if (Math.abs(i) > 1.6) root.add(furn(i));
    const lamps = [lamp(-3.4, 1.4), lamp(4.6, 1.4), lamp(-11, 1.4), lamp(12, 1.4)]; lamps.forEach(l => root.add(l.g));
    const car = new THREE.Group(); car.add(box(2.6, .7, 1.3, mat(0xb83b3b), 0, .55, 0), box(1.5, .55, 1.2, mat(0xb83b3b), -.1, 1.15, 0), box(1.3, .45, 1.22, glow(0x1b2238, .2), -.1, 1.15, 0));
    [[-.85, .62], [.85, .62], [-.85, -.62], [.85, -.62]].forEach(([x, z]) => { const wh = cyl(.3, .3, .2, mat(0x111111), x, .3, z, 12); wh.rotation.x = Math.PI / 2; car.add(wh); });
    car.position.set(-6.2, 0, 3.1); root.add(car);
    const upper = windows.filter(w => !w.shop && w.pos.x > 1 && w.pos.x < 5 && w.pos.y > 3.5);
    const special = upper[0] || windows.find(w => !w.shop) || windows[0];
    const sign = new THREE.PointLight(0xffc46b, 0, 7, 1.8); sign.position.copy(special.pos).add(new THREE.Vector3(0, 0, 1)); root.add(sign);
    root.fog = new THREE.FogExp2(0x2a2258, .024);
    return { root, focus: { window: special.pos }, update(t, sc, k) {
      const fx = sc.fx || '';
      for (const w of windows) {
        let on = w.on ? 1 : 0;
        if (fx === 'dark') on *= k < .25 + ((w.id * 37) % 23) / 23 * .45 ? 1 : 0;
        if (fx === 'window' || sc._afterDark) on = 0;
        if (fx === 'window' && w === special) on = 1;

  },
  supermarket(seed) {
    const root = new THREE.Group(), r = rnd(seed);
    root.add(new THREE.HemisphereLight(0xfff4e0, 0x8a8070, 1.8));
    const key = keyLight(0xffffff, .8, [3, 9, 6], 8); root.add(key);
    const ft = checker('#e9e4da', '#c9c2b4', 10); ft.repeat.set(8, 8);
    root.add(box(30, .1, 30, mat(0xffffff, { map: ft, flatShading: false }), 0, -.05, -6, false));
    root.add(box(30, 6, .3, mat(0xd8d2c4), 0, 3, -13), box(30, .2, 30, mat(0xc9c4b8), 0, 5.2, -6, false));
    const panels = [];
    for (let i = -8; i <= 8; i += 4) for (let z = -10; z <= 2; z += 4) { const p = box(1.8, .06, .5, glow(0xffffff, 1.5), i, 5.08, z, false); root.add(p); panels.push(p); }
    const prod = [0xe8384f, 0xf2b631, 0x3b8fd9, 0x46b058, 0xf07a2b, 0x9b59b6, 0xffffff];
    for (const sx of [-2.6, 2.6]) for (let row = 0; row < 3; row++) {
      const z = -2 - row * 3.4; root.add(box(1, 2.4, 2.8, mat(0x9aa3ad), sx, 1.2, z));
      for (let sh = 0; sh < 4; sh++) { root.add(box(1.05, .05, 2.85, mat(0x6b737d), sx, .35 + sh * .6, z));
        for (let k = 0; k < 7; k++) root.add(box(.3, .32 + r() * .15, .32, mat(prod[Math.floor(r() * prod.length)]), sx + (sx < 0 ? .2 : -.2), .55 + sh * .6, z - 1.15 + k * .38)); }
    }
    root.add(box(3, .9, 1, mat(0x3c4a5a), -5.5, .45, 1.5)); // checkout
    root.fog = new THREE.Fog(0xe8e2d6, 12, 30);
    return { root, focus: {}, update(t) { const f = Math.sin(t * 17) > .92 ? .3 : 1; panels[3].material.emissiveIntensity = 1.5 * f; } };
  },
  island(seed, night = false) {
    const root = new THREE.Group(), r = rnd(seed);
    root.add(night ? sky([[0, '#050916'], [.6, '#122447'], [1, '#26406b']]) : sky([[0, '#2f8fe0'], [.55, '#8fd4ff'], [1, '#ffe7b5']]));
    if (night) root.add(stars(320, 21), moon(18, 28, -60));
    root.add(new THREE.HemisphereLight(night ? 0x5a74b8 : 0xbfe3ff, night ? 0x1a1a24 : 0xe8c58f, night ? .5 : 1.0));
    root.add(keyLight(night ? 0x9fb7ff : 0xfff0d0, night ? .7 : 2.6, night ? [8, 14, -6] : [-7, 11, 5], 10));
    const sand = new THREE.Mesh(new THREE.PlaneGeometry(60, 30, 40, 20), mat(night ? 0x6b5a40 : 0xf0d49a));
    sand.rotation.x = -Math.PI / 2; sand.position.set(0, 0, 4); sand.receiveShadow = true;
    const sp = sand.geometry.attributes.position; for (let i = 0; i < sp.count; i++) sp.setZ(i, .15 * Math.sin(sp.getX(i) * .7) * Math.cos(sp.getY(i) * .5));
    sand.geometry.computeVertexNormals(); root.add(sand);
    const sea = new THREE.Mesh(new THREE.PlaneGeometry(200, 120, 60, 30), new THREE.MeshStandardMaterial({ color: night ? 0x0d2a4d : 0x1d9bd1, roughness: .35, metalness: .1, flatShading: true }));
    sea.rotation.x = -Math.PI / 2; sea.position.set(0, -.05, -68); root.add(sea);
    const palms = [];
    for (const [x, z, h] of [[-3.4, -.6, 4.6], [4.2, -2.6, 5.2], [-7.5, -3.5, 4]]) {
      const g = new THREE.Group(); let px = 0, py = 0;
      for (let k = 0; k < 6; k++) { const s = cyl(.17 - k * .015, .2 - k * .015, h / 6, mat(night ? 0x3b2a1c : 0x8a6038), px, py + h / 12, 0, 7); g.add(s); px += .12 * k / 3; py += h / 6; }

  gl.autoClear = false; gl.clear(); gl.render(postScene, postCam);
  camera.layers.set(1); gl.clearDepth(); gl.render(scene3, camera); gl.autoClear = true;
  drawUI(t, s, sIdx);
  return shot.n;
};
window.ready = true;
</script></body></html>
