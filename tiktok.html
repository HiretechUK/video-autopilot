<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TikTok connected · Video Autopilot</title><link rel="stylesheet" href="style.css"></head><body><main><nav><a href="./">Home</a><a href="privacy.html">Privacy</a><a href="terms.html">Terms</a></nav>
<h1 id="h">Almost done</h1>
<p id="msg">Copy the code below and reply to the "Connect TikTok" email with just the code.</p>
<p><input id="code" readonly style="width:100%;font-size:18px;padding:10px"></p>
<p><button id="copy" style="font-size:16px;padding:10px 18px">Copy code</button></p>
<script>
const q=new URLSearchParams(location.search), c=q.get('code'), e=q.get('error');
const box=document.getElementById('code');
if(c){box.value=c;}else{document.getElementById('h').textContent='No code received';document.getElementById('msg').textContent=e?('TikTok said: '+e+' '+(q.get('error_description')||'')):'Open the link from the email again.';box.style.display='none';document.getElementById('copy').style.display='none';}
document.getElementById('copy').onclick=()=>{box.select();navigator.clipboard.writeText(box.value).then(()=>{document.getElementById('copy').textContent='Copied'});};
</script>
<footer>Operated by Haseeb Ahmed, United Kingdom.</footer></main></body></html>
