name: Blender character preview

on:
  workflow_dispatch:
    inputs:
      percent:
        description: "render size, % of the scene's resolution"
        default: "50"
      blender:
        description: "Blender release folder, e.g. 3.6 or 5.2"
        default: "3.6"

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        scene: ["blender-3.6-splash"]
    steps:
      - uses: actions/checkout@v4
      - name: Blender 5.2 + scene (free CC-BY demo files)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libxi6 libxxf86vm1 libxfixes3 libxrender1 libgl1 libegl1 libxkbcommon0 libsm6 > /dev/null
          V="${{ github.event.inputs.blender }}"
          f=$(curl -s https://download.blender.org/release/Blender$V/ | grep -oE "blender-$V\.[0-9]+-linux-x64\.tar\.xz" | sort -V | tail -1)
          echo "Blender $f"
          curl -sL -o b.tar.xz "https://download.blender.org/release/Blender$V/$f" && tar xf b.tar.xz && mv blender-$V*-linux-x64 blender
          if curl -sfL -o scene.zip "https://mirror.blender.org/demo/splash/${{ matrix.scene }}.zip"; then
            unzip -q scene.zip -d sc && b=$(find sc -name "${{ matrix.scene }}.blend" | head -1); [ -n "$b" ] || b=$(find sc -name "*.blend" -printf "%s %p\n" | sort -n | tail -1 | cut -d" " -f2-); echo "using $b"; echo "SCENE=$PWD/$b" >> $GITHUB_ENV
          else
            curl -sL -o scene.blend "https://mirror.blender.org/demo/splash/${{ matrix.scene }}.blend"; echo "SCENE=$PWD/scene.blend" >> $GITHUB_ENV
          fi
                    ./blender/blender -b "$SCENE" --python-expr "import bpy;print('ARMATURES',[(o.name,len(o.data.bones)) for o in bpy.data.objects if o.type=='ARMATURE']);print('CAM',bpy.context.scene.camera, bpy.context.scene.render.engine)" 2>&1 | grep -E 'ARMATURES|CAM' || true
      - name: Render
        run: |
          mkdir -p out
          /usr/bin/time -v ./blender/blender -b "$SCENE" --python "$PWD/tests/blender/prev.py" -- 1.0 ${{ github.event.inputs.percent }} "$PWD/out/${{ matrix.scene }}.jpg" > render.log 2>&1 || true; head -40 render.log; ls -la "$SCENE"
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: preview-${{ matrix.scene }}
          path: out/
