name: Paws & Claws build release

on:
  workflow_dispatch:
    inputs:
      episodes:
        description: "episode names to (re)build, space separated; empty = all"
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg && pip install -q numpy
      - name: Build
        run: python3 paws/build.py ${{ github.event.inputs.episodes }}
      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view paws-episodes >/dev/null 2>&1 || \
            gh release create paws-episodes --title "Paws & Claws Club episodes" --notes "Premade episodes for the autopilot. Not scheduled for posting yet."
          gh release upload paws-episodes dist/*.mp4 --clobber
          gh release view paws-episodes --json assets --jq '.assets[] | "\(.name) \(.size)"'
