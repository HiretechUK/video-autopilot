name: Video autopilot

on:
  schedule:
    # GitHub can delay or drop scheduled runs, so there are 4 a day. Every scheduled run reads
    # approval replies, posts approved episodes, then makes a new Imagine You episode only if the
    # last one is due (every 2nd day, EPISODE_EVERY_DAYS). Extra runs never make doubles.
    - cron: "13 6 * * *"
    - cron: "37 11 * * *"
    - cron: "23 17 * * *"
    - cron: "41 19 * * *"
  workflow_dispatch:
    inputs:
      cmd:
        description: "make, check, publish, dupcheck, connect_youtube, connect_instagram or connect_tiktok"
        default: make
      series:
        description: "series to make (imagine_you, every_how)"
        default: imagine_you
      force:
        description: "make an extra episode even if one is not due yet (yes/no)"
        default: "no"

permissions:
  contents: write

concurrency:
  group: video-autopilot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fonts
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-inter fonts-dejavu-core ffmpeg
      - name: Python packages
        run: pip install -q kokoro-onnx soundfile anthropic playwright requests cryptography && python -m playwright install --with-deps chromium
      - name: Voice model cache
        uses: actions/cache@v4
        with:
          path: engine/models
          key: kokoro-v1.0
      - name: Voice model
        run: |
          mkdir -p engine/models && cd engine/models
          [ -f kokoro-v1.0.onnx ] || curl -sSL -o kokoro-v1.0.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.onnx
          [ -f voices-v1.0.bin ] || curl -sSL -o voices-v1.0.bin https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin
      - name: Run
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          TOKEN_PASSPHRASE: ${{ secrets.TOKEN_PASSPHRASE }}
          FB_APP_SECRET: ${{ secrets.FB_APP_SECRET }}
          FB_CLIENT_TOKEN: ${{ secrets.FB_CLIENT_TOKEN }}
          IG_USER_TOKEN: ${{ secrets.IG_USER_TOKEN }}
          TT_CLIENT_KEY: ${{ secrets.TT_CLIENT_KEY }}
          TT_CLIENT_SECRET: ${{ secrets.TT_CLIENT_SECRET }}
          FORCE_MAKE: ${{ github.event.inputs.force }}
          GH_TOKEN: ${{ github.token }}
        run: |
          CMD="${{ github.event.inputs.cmd }}"
          if [ -z "$CMD" ]; then
            # scheduled run: replies + posting first, then make an episode if one is due (age-checked)
            rc=0
            python -m autopilot.pipeline check || rc=1
            # one automatic retry if making the episode fails (e.g. a flaky API call)
            python -m autopilot.pipeline make imagine_you || { echo "make failed, retrying in 90s"; sleep 90; python -m autopilot.pipeline make imagine_you; } || rc=1
            # Every How: one a day (due-checked, so 4 runs a day never make two)
            python -m autopilot.pipeline make every_how || { echo "Every How make failed, retrying in 90s"; sleep 90; python -m autopilot.pipeline make every_how; } || rc=1
            exit $rc
          else
            python -m autopilot.pipeline $CMD ${{ github.event.inputs.series || 'imagine_you' }}
          fi
      - name: Save state
        if: always()
        run: |
          git config user.name "video-autopilot"
          git config user.email "actions@users.noreply.github.com"
          git add autopilot/state.json episodes || true
          [ -f autopilot/tokens.enc ] && git add autopilot/tokens.enc || true
          git diff --cached --quiet || (git commit -m "autopilot: update episodes and state" && git pull --rebase --autostash && git push)
