name: Split vocals

on:
  workflow_dispatch:
    inputs:
      song:
        description: "audio file in the repo"
        default: "tests/songs/Rory-song-A.mp3"

jobs:
  stems:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Demucs (CPU)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install -q demucs soundfile
          python -m demucs --two-stems=vocals -n htdemucs -o stems "${{ github.event.inputs.song }}"
          find stems -type f
      - uses: actions/upload-artifact@v4
        with:
          name: stems
          path: stems/
